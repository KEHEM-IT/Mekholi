<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMIS Teacher Details</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 500px;
        background: #fff;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }

      h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #444;
      }

      input,
      select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
      }

      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #0078d4;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #005fa3;
      }

      pre {
        margin-top: 20px;
        padding: 15px;
        background: #272822;
        color: #f8f8f2;
        border-radius: 6px;
        max-height: 400px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>EMIS Teacher Details</h2>

      <form id="teacherForm">
        <div class="form-group">
          <label for="instituteId">Institute ID (Optional)</label>
          <input
            type="text"
            id="instituteId"
            name="instituteId"
            placeholder="Enter Institute ID"
          />
        </div>

        <div class="form-group">
          <label for="EIIN">EIIN (Optional)</label>
          <input type="text" id="EIIN" name="EIIN" placeholder="Enter EIIN" />
        </div>

        <div class="form-group">
          <label for="isTeacher">Is Teacher (Optional)</label>
          <select id="isTeacher" name="isTeacher">
            <option value="">-- Select --</option>
            <option value="true">true</option>
            <option value="false">false</option>
          </select>
        </div>

        <button type="submit">Send Request</button>
      </form>

      <pre id="result">Response will appear here...</pre>
    </div>

    <script>
      const form = document.getElementById("teacherForm");
      const result = document.getElementById("result");

      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        const body = {};

        if (form.instituteId.value.trim() !== "") {
          body.instituteId = form.instituteId.value.trim();
        }

        if (form.EIIN.value.trim() !== "") {
          body.EIIN = form.EIIN.value.trim();
        }

        if (form.isTeacher.value !== "") {
          body.isTeacher = form.isTeacher.value === "true";
        }

        result.textContent = "Loading...";

        try {
          const response = await fetch(
            "https://emis.gov.bd/emis/Portal/GetTeacherDetails",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(body),
            },
          );

          const text = await response.text();

          try {
            const json = JSON.parse(text);
            result.textContent = JSON.stringify(json, null, 4);
          } catch {
            result.textContent = text;
          }
        } catch (error) {
          result.textContent = "Error:\n\n" + error;
        }
      });
    </script>
  </body>
</html>
