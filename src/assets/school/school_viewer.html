<style>
  :root{
    --bg:#0f1420; --panel:#161d2e; --panel2:#1c2438; --border:#2a3350;
    --text:#e8ecf5; --muted:#8b93ab; --accent:#5b8cff; --accent2:#38d4a4;
    --warn:#ffb454; --danger:#ff6b6b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI', 'Noto Sans Bengali', Arial, sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5;
  }
  header{
    padding:24px 28px; background:linear-gradient(135deg,#1c2748,#131a2c);
    border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20;
  }
  header h1{margin:0 0 4px; font-size:1.4rem;}
  header .sub{color:var(--muted); font-size:0.95rem;}
  .toolbar{
    display:flex; gap:12px; margin-top:14px; flex-wrap:wrap; align-items:center;
  }
  .toolbar input[type=text]{
    flex:1; min-width:220px; padding:9px 12px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel); color:var(--text); font-size:0.95rem; outline:none;
  }
  .toolbar input[type=text]:focus{border-color:var(--accent);}
  .toolbar button{
    padding:9px 14px; border-radius:8px; border:1px solid var(--border); background:var(--panel2);
    color:var(--text); cursor:pointer; font-size:0.88rem;
  }
  .toolbar button:hover{border-color:var(--accent); color:var(--accent);}
  main{padding:20px 28px 60px; max-width:1400px; margin:0 auto;}
  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; margin-bottom:16px;}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:12px; overflow:hidden;
  }
  .card.full{grid-column:1/-1;}
  .card-header{
    padding:12px 16px; background:var(--panel2); display:flex; align-items:center; justify-content:space-between;
    cursor:pointer; user-select:none;
  }
  .card-header h2{margin:0; font-size:1rem; font-weight:600;}
  .card-header .count{color:var(--muted); font-size:0.82rem; font-weight:400; margin-left:8px;}
  .chev{transition:transform .18s ease; color:var(--muted);}
  .card.collapsed .chev{transform:rotate(-90deg);}
  .card-body{padding:14px 16px;}
  .card.collapsed .card-body{display:none;}
  .kv{width:100%; border-collapse:collapse;}
  .kv tr{border-bottom:1px solid var(--border);}
  .kv tr:last-child{border-bottom:none;}
  .kv td{padding:7px 6px; vertical-align:top; font-size:0.9rem;}
  .kv td.k{color:var(--muted); width:42%; white-space:nowrap;}
  .kv td.v{color:var(--text); word-break:break-word;}
  .empty{color:var(--muted); font-style:italic; font-size:0.88rem; padding:6px 0;}
  table.data{width:100%; border-collapse:collapse; font-size:0.85rem;}
  table.data thead th{
    position:sticky; top:0; background:var(--panel2); color:var(--muted); text-align:left;
    padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap; font-weight:600;
  }
  table.data tbody td{padding:7px 10px; border-bottom:1px solid var(--border); vertical-align:top;}
  table.data tbody tr:hover{background:rgba(91,140,255,0.06);}
  .table-wrap{overflow-x:auto; max-height:480px; overflow-y:auto; border-radius:8px; border:1px solid var(--border);}
  .badge{
    display:inline-block; padding:2px 8px; border-radius:999px; font-size:0.76rem; font-weight:600;
  }
  .badge.ok{background:rgba(56,212,164,0.15); color:var(--accent2);}
  .badge.missing{background:rgba(255,107,107,0.12); color:var(--danger);}
  .null-val{color:var(--muted); font-style:italic;}
  .hidden{display:none !important;}
  .toplevel-title{
    margin:0; font-size:1.6rem;
  }
  .toplevel-sub{color:var(--muted); margin-top:2px;}
  a{color:var(--accent);}
  .footer-note{color:var(--muted); font-size:0.8rem; text-align:center; margin-top:30px;}
</style>
</head>

function titleCase(key){
  return key
    .replace(/_/g,' ')
    .replace(/\b\w/g, c => c.toUpperCase());
}

function isEmptyValue(v){
  if(v === null || v === undefined) return true;
  if(Array.isArray(v)) return v.length === 0;
  if(typeof v === 'object') return Object.keys(v).length === 0;
  if(typeof v === 'string') return v.trim() === '';
  return false;
}

function formatScalar(v){
  if(v === null || v === undefined) return '<span class="null-val">—</span>';
  if(typeof v === 'boolean') return v ? '<span class="badge ok">Yes</span>' : '<span class="badge missing">No</span>';
  return String(v);
}

function renderKV(obj){
  const keys = Object.keys(obj);
  if(keys.length === 0) return '<div class="empty">No data</div>';
  let rows = keys.map(k => {
    const v = obj[k];
    return `<tr><td class="k">${titleCase(k)}</td><td class="v">${formatScalar(v)}</td></tr>`;
  }).join('');
  return `<table class="kv">${rows}</table>`;
}

function renderTable(arr){
  if(arr.length === 0) return '<div class="empty">No records</div>';
  // union of all keys across all rows, preserving first-seen order
  const colSet = [];
  arr.forEach(row => {
    if(row && typeof row === 'object' && !Array.isArray(row)){
      Object.keys(row).forEach(k => { if(!colSet.includes(k)) colSet.push(k); });
    }
  });
  if(colSet.length === 0){
    // array of primitives
    const items = arr.map(v => `<li>${formatScalar(v)}</li>`).join('');
    return `<ul>${items}</ul>`;
  }
  const thead = `<thead><tr>${colSet.map(c => `<th>${titleCase(c)}</th>`).join('')}</tr></thead>`;
  const tbody = `<tbody>${arr.map(row => {
    const cells = colSet.map(c => {
      const v = row ? row[c] : undefined;
      if(v && typeof v === 'object') return `<td>${JSON.stringify(v)}</td>`;
      return `<td>${formatScalar(v)}</td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('')}</tbody>`;
  return `<div class="table-wrap"><table class="data">${thead}${tbody}</table></div>`;
}

function renderSectionBody(value){
  if(Array.isArray(value)){
    return renderTable(value);
  }
  if(value && typeof value === 'object'){
    return renderKV(value);
  }
  return `<div class="kv">${formatScalar(value)}</div>`;
}

function countLabel(value){
  if(Array.isArray(value)) return `${value.length} record${value.length===1?'':'s'}`;
  if(value && typeof value === 'object') return `${Object.keys(value).length} field${Object.keys(value).length===1?'':'s'}`;
  return '';
}

function buildApp(data){
  const app = document.getElementById('app');
  app.innerHTML = '';

  document.getElementById('instituteTitle').textContent =
    data.institute_name_en || data.institute_name_bn || 'School Data Viewer';
  const subParts = [];
  if(data.institute_name_bn) subParts.push(data.institute_name_bn);
  if(data.establishment_date) subParts.push('Est. ' + data.establishment_date);
  document.getElementById('instituteSub').textContent = subParts.join(' · ');

  const grid = document.createElement('div');
  grid.className = 'grid';
  app.appendChild(grid);

  // top-level scalar fields (non-object, non-array) grouped into one "Overview" card
  const scalarKeys = Object.keys(data).filter(k => {
    const v = data[k];
    return v === null || typeof v !== 'object';
  });
  if(scalarKeys.length){
    const overviewObj = {};
    scalarKeys.forEach(k => overviewObj[k] = data[k]);
    grid.appendChild(makeCard('overview', 'Overview', overviewObj, false));
  }

  Object.keys(data).forEach(key => {
    const v = data[key];
    if(scalarKeys.includes(key)) return;
    const empty = isEmptyValue(v);
    const card = makeCard(key, titleCase(key), v, empty);
    grid.appendChild(card);
  });
}

function makeCard(key, label, value, isEmpty){
  const card = document.createElement('div');
  card.className = 'card full';
  card.dataset.key = key;

  const cnt = countLabel(value);
  const header = document.createElement('div');
  header.className = 'card-header';
  header.innerHTML = `<h2>${label}${cnt ? `<span class="count">${cnt}</span>` : ''}</h2><span class="chev">▾</span>`;
  header.addEventListener('click', () => card.classList.toggle('collapsed'));

  const body = document.createElement('div');
  body.className = 'card-body';
  body.innerHTML = renderSectionBody(value);

  if(isEmpty) card.classList.add('collapsed');

  card.appendChild(header);
  card.appendChild(body);
  return card;
}

buildApp(DATA);

// Search
const searchBox = document.getElementById('searchBox');
searchBox.addEventListener('input', () => {
  const q = searchBox.value.trim().toLowerCase();
  const cards = document.querySelectorAll('#app .card');
  if(!q){
    cards.forEach(c => { c.classList.remove('hidden'); });
    return;
  }
  cards.forEach(c => {
    const text = c.textContent.toLowerCase();
    if(text.includes(q)){
      c.classList.remove('hidden');
      c.classList.remove('collapsed');
    } else {
      c.classList.add('hidden');
    }
  });
});

document.getElementById('expandAllBtn').addEventListener('click', () => {
  document.querySelectorAll('#app .card').forEach(c => c.classList.remove('collapsed'));
});
document.getElementById('collapseAllBtn').addEventListener('click', () => {
  document.querySelectorAll('#app .card').forEach(c => c.classList.add('collapsed'));
});
