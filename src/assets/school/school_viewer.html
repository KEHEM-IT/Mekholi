<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Data Viewer</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2e; --panel2:#1c2438; --border:#2a3350;
    --text:#e8ecf5; --muted:#8b93ab; --accent:#5b8cff; --accent2:#38d4a4;
    --warn:#ffb454; --danger:#ff6b6b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI', 'Noto Sans Bengali', Arial, sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5;
  }
  header{
    padding:24px 28px; background:linear-gradient(135deg,#1c2748,#131a2c);
    border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20;
  }
  header h1{margin:0 0 4px; font-size:1.4rem;}
  header .sub{color:var(--muted); font-size:0.95rem;}
  .toolbar{
    display:flex; gap:12px; margin-top:14px; flex-wrap:wrap; align-items:center;
  }
  .toolbar input[type=text]{
    flex:1; min-width:220px; padding:9px 12px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel); color:var(--text); font-size:0.95rem; outline:none;
  }
  .toolbar input[type=text]:focus{border-color:var(--accent);}
  .toolbar select{
    padding:9px 12px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel); color:var(--text); font-size:0.9rem; outline:none;
  }
  .toolbar button{
    padding:9px 14px; border-radius:8px; border:1px solid var(--border); background:var(--panel2);
    color:var(--text); cursor:pointer; font-size:0.88rem;
  }
  .toolbar button:hover{border-color:var(--accent); color:var(--accent);}
  .toolbar label.file-btn{
    padding:9px 14px; border-radius:8px; border:1px solid var(--border); background:var(--panel2);
    color:var(--text); cursor:pointer; font-size:0.88rem;
  }
  .toolbar label.file-btn:hover{border-color:var(--accent); color:var(--accent);}
  main{padding:20px 28px 60px; max-width:1400px; margin:0 auto;}
  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; margin-bottom:16px;}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:12px; overflow:hidden;
  }
  .card.full{grid-column:1/-1;}
  .card-header{
    padding:12px 16px; background:var(--panel2); display:flex; align-items:center; justify-content:space-between;
    cursor:pointer; user-select:none;
  }
  .card-header h2{margin:0; font-size:1rem; font-weight:600; font-family:'Consolas','Courier New',monospace;}
  .card-header .count{color:var(--muted); font-size:0.82rem; font-weight:400; margin-left:8px; font-family:'Segoe UI',sans-serif;}
  .chev{transition:transform .18s ease; color:var(--muted);}
  .card.collapsed .chev{transform:rotate(-90deg);}
  .card-body{padding:14px 16px;}
  .card.collapsed .card-body{display:none;}
  .kv{width:100%; border-collapse:collapse;}
  .kv tr{border-bottom:1px solid var(--border);}
  .kv tr:last-child{border-bottom:none;}
  .kv td{padding:7px 6px; vertical-align:top; font-size:0.9rem;}
  .kv td.k{color:var(--muted); width:42%; white-space:nowrap; font-family:'Consolas','Courier New',monospace; font-size:0.83rem;}
  .kv td.v{color:var(--text); word-break:break-word;}
  .empty{color:var(--muted); font-style:italic; font-size:0.88rem; padding:6px 0;}
  table.data{width:100%; border-collapse:collapse; font-size:0.85rem;}
  table.data thead th{
    position:sticky; top:0; background:var(--panel2); color:var(--muted); text-align:left;
    padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap; font-weight:600;
    font-family:'Consolas','Courier New',monospace; font-size:0.78rem;
  }
  table.data tbody td{padding:7px 10px; border-bottom:1px solid var(--border); vertical-align:top;}
  table.data tbody tr:hover{background:rgba(91,140,255,0.06);}
  .table-wrap{overflow-x:auto; max-height:480px; overflow-y:auto; border-radius:8px; border:1px solid var(--border);}
  .badge{
    display:inline-block; padding:2px 8px; border-radius:999px; font-size:0.76rem; font-weight:600;
  }
  .badge--success{background:rgba(56,212,164,0.16); color:var(--accent2);}
  .badge--warning{background:rgba(255,180,84,0.16); color:var(--warn);}
  .badge--danger{background:rgba(255,107,107,0.16); color:var(--danger);}
  .badge--info{background:rgba(91,140,255,0.16); color:var(--accent);}
  .badge--neutral{background:rgba(139,147,171,0.16); color:var(--muted);}
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px;}
  .stat-card{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:16px; text-align:center;
  }
  .stat-num{font-size:1.6rem; font-weight:700; color:var(--accent2); font-family:'Consolas','Courier New',monospace;}
  .stat-label{color:var(--muted); font-size:0.78rem; margin-top:4px;}
  .kv td.k.nested-1{padding-left:22px;}
  .kv td.k.nested-2{padding-left:38px;}
  .search-hidden{display:none !important;}
  .status-banner{
    padding:14px 16px; border-radius:10px; border:1px solid var(--border);
    background:var(--panel); color:var(--muted); font-size:0.9rem; margin-bottom:16px;
  }
  .status-banner.is-error{border-color:var(--danger); color:var(--danger);}
  .match-count{
    color:var(--muted); font-size:0.82rem; margin-left:auto; white-space:nowrap;
  }
  @media (max-width:640px){
    header{padding:16px 18px;}
    main{padding:14px 18px 40px;}
    .kv td.k{width:48%;}
  }
</style>
</head>
<body>
<header>
  <h1 id="pageTitle">School Data Viewer</h1>
  <div class="sub" id="pageSub">Loading school_new.json…</div>
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="🔎 Search any field, name, phone, address…">
    <select id="schoolSelect" style="display:none;"></select>
    <button type="button" id="expandAllBtn">Expand All</button>
    <button type="button" id="collapseAllBtn">Collapse All</button>
    <button type="button" id="reloadBtn">↻ Reload</button>
    <label class="file-btn" for="fileInput">📂 Open JSON File</label>
    <input type="file" id="fileInput" accept="application/json,.json" hidden>
  </div>
</header>
<main id="app">
  <div class="empty" id="statusMsg">Loading school_new.json…</div>
</main>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------
  var rawData = null;      // whatever top-level JSON object was loaded
  var records = [];        // array of school objects being displayed
  var currentIndex = 0;    // which record in `records` is on screen

  var app = document.getElementById('app');
  var statusMsg = document.getElementById('statusMsg');
  var pageTitle = document.getElementById('pageTitle');
  var pageSub = document.getElementById('pageSub');
  var searchInput = document.getElementById('searchInput');
  var schoolSelect = document.getElementById('schoolSelect');
  var expandAllBtn = document.getElementById('expandAllBtn');
  var collapseAllBtn = document.getElementById('collapseAllBtn');
  var reloadBtn = document.getElementById('reloadBtn');
  var fileInput = document.getElementById('fileInput');

  // ---------------------------------------------------------------------
  // Helpers
  // ---------------------------------------------------------------------

  // "institute_name_bn" -> "Institute Name Bn" (key text itself is never
  // changed/renamed — this only affects how it is *displayed*).
  function humanizeKey(key) {
    return String(key)
      .replace(/[_\-]+/g, ' ')
      .trim()
      .split(' ')
      .filter(Boolean)
      .map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1); })
      .join(' ');
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function isPlainObject(v) {
    return v !== null && typeof v === 'object' && !Array.isArray(v);
  }

  function isArrayOfObjects(v) {
    return Array.isArray(v) && v.length > 0 && v.every(isPlainObject);
  }

  // Bengali "হ্যাঁ/না" and English "Yes/No" style flags get a colored badge;
  // everything else is plain escaped text. Null/empty renders as an em-dash.
  function formatScalar(v) {
    if (v === null || v === undefined || v === '') {
      return '<span class="empty">—</span>';
    }
    var s = String(v);
    var low = s.trim().toLowerCase();
    if (low === 'yes' || s === 'হ্যাঁ' || low === 'recognized' || low === 'active') {
      return '<span class="badge badge--success">' + escapeHtml(s) + '</span>';
    }
    if (low === 'no' || s === 'না') {
      return '<span class="badge badge--neutral">' + escapeHtml(s) + '</span>';
    }
    return escapeHtml(s);
  }

  // ---------------------------------------------------------------------
  // Flatten a plain object (possibly nested) into an ordered list of
  // { key, depth, value } rows for a .kv table — key is the original
  // JSON key (never renamed), depth only controls display indentation.
  // ---------------------------------------------------------------------
  function flattenObject(obj, depth) {
    depth = depth || 0;
    var rows = [];
    Object.keys(obj).forEach(function (key) {
      var val = obj[key];
      if (isPlainObject(val)) {
        rows.push({ key: key, depth: depth, isGroup: true });
        rows = rows.concat(flattenObject(val, depth + 1));
      } else if (Array.isArray(val)) {
        // A nested array inside what is otherwise a flat object: show it
        // inline as a joined list rather than opening a whole sub-table.
        rows.push({ key: key, depth: depth, value: val.length ? val.join(', ') : null });
      } else {
        rows.push({ key: key, depth: depth, value: val });
      }
    });
    return rows;
  }

  function kvRowsHtml(rows) {
    return rows.map(function (r) {
      var nestClass = r.depth > 0 ? ' nested-' + Math.min(r.depth, 2) : '';
      var keyHtml = escapeHtml(r.key);
      if (r.isGroup) {
        return '<tr class="kv-row" data-search="' + escapeHtml(r.key.toLowerCase()) + '">' +
          '<td class="k' + nestClass + '"><strong>' + keyHtml + '</strong></td><td class="v"></td></tr>';
      }
      var valText = String(r.value == null ? '' : r.value).toLowerCase();
      return '<tr class="kv-row" data-search="' + escapeHtml(r.key.toLowerCase() + ' ' + valText) + '">' +
        '<td class="k' + nestClass + '">' + keyHtml + '</td>' +
        '<td class="v">' + formatScalar(r.value) + '</td></tr>';
    }).join('');
  }

  // A card built from a flat/nested plain object -> .kv table.
  function buildObjectCard(title, obj, opts) {
    opts = opts || {};
    var rows = flattenObject(obj);
    var body = rows.length
      ? '<div class="table-wrap"><table class="kv">' + kvRowsHtml(rows) + '</table></div>'
      : '<div class="empty">No data</div>';
    return buildCard(title, rows.length, body, opts);
  }

  // A card built from an array of objects -> table.data. Columns are the
  // union of every key seen across all items, in first-seen order, so
  // rows with occasional extra fields (e.g. a null vs missing key) don't
  // break the table. Column headers use the raw JSON key (humanized for
  // display only).
  function buildArrayCard(title, arr, opts) {
    opts = opts || {};
    if (!arr.length) {
      return buildCard(title, 0, '<div class="empty">No entries</div>', opts);
    }

    if (!isArrayOfObjects(arr)) {
      // Array of primitives.
      var listHtml = '<div class="table-wrap"><table class="kv"><tr class="kv-row" data-search="' +
        escapeHtml(arr.join(' ').toLowerCase()) + '"><td class="v">' +
        arr.map(function (v) { return formatScalar(v); }).join(', ') + '</td></tr></table></div>';
      return buildCard(title, arr.length, listHtml, opts);
    }

    var columns = [];
    arr.forEach(function (item) {
      Object.keys(item).forEach(function (k) {
        if (columns.indexOf(k) === -1) columns.push(k);
      });
    });

    var thead = '<thead><tr>' + columns.map(function (c) {
      return '<th>' + escapeHtml(humanizeKey(c)) + '</th>';
    }).join('') + '</tr></thead>';

    var tbody = '<tbody>' + arr.map(function (item) {
      var searchText = columns.map(function (c) { return item[c] == null ? '' : String(item[c]); }).join(' ').toLowerCase();
      var cells = columns.map(function (c) {
        var v = item[c];
        if (isPlainObject(v) || Array.isArray(v)) v = JSON.stringify(v);
        return '<td>' + formatScalar(v) + '</td>';
      }).join('');
      return '<tr class="data-row" data-search="' + escapeHtml(searchText) + '">' + cells + '</tr>';
    }).join('') + '</tbody>';

    var body = '<div class="table-wrap"><table class="data">' + thead + tbody + '</table></div>';
    return buildCard(title, arr.length, body, opts);
  }

  function buildCard(title, count, bodyHtml, opts) {
    var full = opts.full ? ' full' : '';
    var countHtml = count === undefined ? '' : '<span class="count">(' + count + ')</span>';
    return (
      '<div class="card' + full + '" data-card>' +
        '<div class="card-header" data-card-toggle>' +
          '<h2>' + escapeHtml(humanizeKey(title)) + countHtml + '</h2>' +
          '<i class="chev">▾</i>' +
        '</div>' +
        '<div class="card-body">' + bodyHtml + '</div>' +
      '</div>'
    );
  }

  // Basic Info card: every top-level key on the record whose value is a
  // plain scalar (string/number/boolean/null) — original key order kept.
  function scalarKeys(record) {
    var out = {};
    Object.keys(record).forEach(function (k) {
      var v = record[k];
      if (!isPlainObject(v) && !Array.isArray(v)) out[k] = v;
    });
    return out;
  }

  function buildStatGrid(record) {
    var cards = [];
    Object.keys(record).forEach(function (k) {
      var v = record[k];
      if (Array.isArray(v)) {
        cards.push(
          '<div class="stat-card"><div class="stat-num">' + v.length + '</div>' +
          '<div class="stat-label">' + escapeHtml(humanizeKey(k)) + '</div></div>'
        );
      }
    });
    if (!cards.length) return '';
    return '<div class="stat-grid">' + cards.join('') + '</div>';
  }

  // ---------------------------------------------------------------------
  // Render one school record (an object from school_data[]) into #app.
  // ---------------------------------------------------------------------
  function renderRecord(record) {
    var nameEn = record.institute_name_en || record.institute_name_bn || 'Untitled record';
    pageTitle.textContent = nameEn;
    pageSub.textContent = (record.institute_name_bn || '') +
      (records.length > 1 ? '  •  record ' + (currentIndex + 1) + ' of ' + records.length : '');

    var html = '';
    html += buildStatGrid(record);
    html += '<div class="grid">';
    html += buildObjectCard('Basic Info', scalarKeys(record), { full: true });

    Object.keys(record).forEach(function (key) {
      var val = record[key];
      if (!isPlainObject(val) && !Array.isArray(val)) return; // already in Basic Info
      if (isPlainObject(val)) {
        html += buildObjectCard(key, val, { full: true });
      } else if (Array.isArray(val)) {
        html += buildArrayCard(key, val, { full: isArrayOfObjects(val) });
      }
    });

    html += '</div>';
    app.innerHTML = html;
    applySearch(searchInput.value);
  }

  function renderSchoolSelect() {
    if (records.length <= 1) {
      schoolSelect.style.display = 'none';
      return;
    }
    schoolSelect.style.display = '';
    schoolSelect.innerHTML = records.map(function (r, i) {
      var label = r.institute_name_en || r.institute_name_bn || ('Record ' + (i + 1));
      return '<option value="' + i + '">' + escapeHtml(label) + '</option>';
    }).join('');
    schoolSelect.value = String(currentIndex);
  }

  // ---------------------------------------------------------------------
  // Search — filters rows inside every card by their data-search text,
  // and hides any card left with zero visible rows.
  // ---------------------------------------------------------------------
  function applySearch(term) {
    term = (term || '').trim().toLowerCase();
    var cards = app.querySelectorAll('[data-card]');
    cards.forEach(function (card) {
      var rows = card.querySelectorAll('[data-search]');
      var visibleCount = 0;
      rows.forEach(function (row) {
        var match = !term || row.getAttribute('data-search').indexOf(term) !== -1;
        row.classList.toggle('search-hidden', !match);
        if (match) visibleCount++;
      });
      var hasSearchableRows = rows.length > 0;
      card.classList.toggle('search-hidden', term !== '' && hasSearchableRows && visibleCount === 0);
    });
  }

  // ---------------------------------------------------------------------
  // Loading data — accepts either { "school_data": [ {...}, ... ] } or a
  // bare array / single object, so any similarly-shaped export still works.
  // ---------------------------------------------------------------------
  function useData(json, sourceLabel) {
    rawData = json;
    if (Array.isArray(json)) {
      records = json;
    } else if (json && Array.isArray(json.school_data)) {
      records = json.school_data;
    } else if (isPlainObject(json)) {
      records = [json];
    } else {
      records = [];
    }

    if (!records.length) {
      showStatus('Loaded ' + sourceLabel + ', but no school records were found inside it.', true);
      return;
    }

    currentIndex = 0;
    renderSchoolSelect();
    renderRecord(records[currentIndex]);
  }

  function showStatus(message, isError) {
    app.innerHTML = '<div class="status-banner' + (isError ? ' is-error' : '') + '">' + escapeHtml(message) + '</div>';
    pageSub.textContent = isError ? 'Failed to load data' : 'Loading…';
  }

  function loadFromFetch() {
    showStatus('Loading school_new.json…', false);
    fetch('./school_new.json')
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (json) { useData(json, 'school_new.json'); })
      .catch(function (err) {
        showStatus(
          'Could not fetch school_new.json directly (' + err.message + '). ' +
          'If you opened this file straight from disk (file://), browsers block that request — ' +
          'use the "Open JSON File" button above to pick school_new.json manually instead.',
          true
        );
      });
  }

  function loadFromFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var json = JSON.parse(String(reader.result));
        useData(json, file.name);
      } catch (e) {
        showStatus('Could not parse "' + file.name + '" as JSON: ' + e.message, true);
      }
    };
    reader.onerror = function () {
      showStatus('Could not read "' + file.name + '".', true);
    };
    reader.readAsText(file);
  }

  // ---------------------------------------------------------------------
  // Events
  // ---------------------------------------------------------------------
  searchInput.addEventListener('input', function () { applySearch(searchInput.value); });

  schoolSelect.addEventListener('change', function () {
    currentIndex = Number(schoolSelect.value) || 0;
    renderRecord(records[currentIndex]);
  });

  expandAllBtn.addEventListener('click', function () {
    app.querySelectorAll('[data-card]').forEach(function (c) { c.classList.remove('collapsed'); });
  });

  collapseAllBtn.addEventListener('click', function () {
    app.querySelectorAll('[data-card]').forEach(function (c) { c.classList.add('collapsed'); });
  });

  reloadBtn.addEventListener('click', loadFromFetch);

  fileInput.addEventListener('change', function () {
    if (fileInput.files && fileInput.files[0]) loadFromFile(fileInput.files[0]);
  });

  // Event delegation for per-card collapse/expand toggling.
  app.addEventListener('click', function (e) {
    var toggle = e.target.closest ? e.target.closest('[data-card-toggle]') : null;
    if (!toggle) return;
    toggle.closest('[data-card]').classList.toggle('collapsed');
  });

  // ---------------------------------------------------------------------
  // Bootstrap
  // ---------------------------------------------------------------------
  loadFromFetch();
})();
</script>
</body>
</html>
